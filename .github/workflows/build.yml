name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux OpenGL dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          modules: 'qtshadertools'
          cache: true

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev

      - name: Generate build-profile SBOM
        shell: bash
        run: |
          QT_VERSION="$(qmake -query QT_VERSION)"
          python scripts/generate_sbom.py --qt-version "$QT_VERSION" --output build/solidarcad.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: solidarcad-sbom-${{ matrix.os }}
          path: build/solidarcad.spdx.json

      - name: Test
        run: ctest --preset dev
