name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triplet: ci-x64-windows
          - os: ubuntu-24.04
            triplet: ci-x64-linux
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.cache/vcpkg-binaries,readwrite

    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 00c5775211f45cd08b37fce0484b4cb940e422ab
          path: vcpkg

      - name: Install Linux OpenGL dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 zstd

      - name: Enable MSVC command line tools
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt on Linux
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          archives: 'qtbase'
          cache: true
          cache-key-prefix: qt-6.8.3-linux-qtbase

      - name: Install Qt on Windows
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtshadertools'
          cache: true

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .cache/vcpkg-binaries
          key: vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', 'triplets/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.triplet }}-

      - name: Bootstrap vcpkg
        if: runner.os == 'Linux'
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg
        if: runner.os == 'Windows'
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Generate build-profile SBOM
        shell: bash
        run: |
          QT_VERSION="$(qmake -query QT_VERSION)"
          python scripts/generate_sbom.py --qt-version "$QT_VERSION" --occt-version "8.0.1" --build-profile ci --output build/solidarcad.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: solidarcad-sbom-${{ matrix.os }}
          path: build/solidarcad.spdx.json

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --preset ci

      - name: Package Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash scripts/package_linux_build_deps.sh \
            "$QT_ROOT_DIR" \
            "$VCPKG_ROOT" \
            "$GITHUB_WORKSPACE/.cache/vcpkg-binaries" \
            "$GITHUB_WORKSPACE/build/solidarcad-build-deps-ubuntu24.04-x64.tar.zst"

      - name: Upload Linux build dependencies
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: solidarcad-build-deps-ubuntu24.04-x64
          path: |
            build/solidarcad-build-deps-ubuntu24.04-x64.tar.zst
            build/solidarcad-build-deps-ubuntu24.04-x64.tar.zst.sha256

      - name: Configure Release profile
        run: cmake --preset release

      - name: Build Release profile
        run: cmake --build --preset release

      - name: Verify Release install foundation
        run: cmake --install build/release

      - name: Package release
        run: cpack --config build/release/CPackConfig.cmake

      - name: Validate and finalize release artifacts
        if: runner.os == 'Windows'
        run: python scripts/finalize_release.py --root . --build-dir build/release

      - name: Validate Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package="$(find build/release -maxdepth 1 -name 'solidarcad_*_amd64.deb' -print -quit)"
          test -n "$package"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package" | grep -F './opt/solidarcad/bin/solidar'
          dpkg-deb --contents "$package" | grep -F './opt/solidarcad/bin/qt.conf'
          dpkg-deb --contents "$package" | grep -F './opt/solidarcad/lib/libQt6Core.so.6'
          dpkg-deb --contents "$package" | grep -F './opt/solidarcad/plugins/platforms/libqxcb.so'
          dpkg-deb --contents "$package" | grep -F './usr/bin/solidar'
          dpkg-deb --contents "$package" | grep -F './usr/share/applications/solidarcad.desktop'
          dpkg-deb --contents "$package" | grep -F './usr/share/mime/packages/application-x-solidarcad.xml'
          sha256sum "$package" > "$package.sha256"
          python scripts/generate_sbom.py \
            --qt-version 6.8.3 \
            --occt-version 8.0.1 \
            --build-profile release \
            --output "${package%.deb}.spdx.json"

      - name: Install and smoke-test Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package="$(find build/release -maxdepth 1 -name 'solidarcad_*_amd64.deb' -print -quit)"
          sudo apt-get install -y "$package"
          test -x /usr/bin/solidar
          test -x /opt/solidarcad/bin/solidar
          desktop-file-validate /usr/share/applications/solidarcad.desktop
          if env -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH \
              ldd /opt/solidarcad/bin/solidar | grep -F 'not found'; then
            exit 1
          fi
          set +e
          env -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH \
            QT_QPA_PLATFORM=offscreen timeout 10s solidar
          status=$?
          set -e
          test "$status" -eq 124

      - name: Upload portable release
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: solidarcad-portable-${{ matrix.os }}
          path: build/release/SolidarCAD-*

      - name: Upload Debian package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: solidarcad-deb-ubuntu24.04-x64
          path: |
            build/release/solidarcad_*.deb
            build/release/solidarcad_*.deb.sha256
            build/release/solidarcad_*.spdx.json

  sanitizers:
    runs-on: ubuntu-24.04
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_TRIPLET: ci-x64-linux
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.cache/vcpkg-binaries,readwrite

    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 00c5775211f45cd08b37fce0484b4cb940e422ab
          path: vcpkg

      - name: Install Linux OpenGL dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 zstd

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          archives: 'qtbase'
          cache: true
          cache-key-prefix: qt-6.8.3-linux-qtbase

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .cache/vcpkg-binaries
          key: vcpkg-ubuntu-sanitizers-${{ hashFiles('vcpkg.json', 'triplets/**') }}
          restore-keys: |
            vcpkg-ubuntu-sanitizers-
            vcpkg-Linux-ci-x64-linux-

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure sanitizers
        run: cmake --preset sanitizers

      - name: Build sanitizers
        run: cmake --build --preset sanitizers

      - name: Test sanitizers
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --preset sanitizers
