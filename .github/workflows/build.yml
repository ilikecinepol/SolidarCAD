name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triplet: ci-x64-windows
          - os: ubuntu-24.04
            triplet: ci-x64-linux
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}

    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 00c5775211f45cd08b37fce0484b4cb940e422ab
          path: vcpkg

      - name: Install Linux OpenGL dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0

      - name: Enable MSVC command line tools
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtshadertools'
          cache: true

      - name: Bootstrap vcpkg
        if: runner.os == 'Linux'
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg
        if: runner.os == 'Windows'
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Generate build-profile SBOM
        shell: bash
        run: |
          QT_VERSION="$(qmake -query QT_VERSION)"
          python scripts/generate_sbom.py --qt-version "$QT_VERSION" --occt-version "8.0.1" --output build/solidarcad.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: solidarcad-sbom-${{ matrix.os }}
          path: build/solidarcad.spdx.json

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --preset ci
